<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>메이크파크</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/coaster.css">
</head>
<body>
  <div id="app">
    <canvas id="stage" aria-label="메이크파크 공원 지도"></canvas>

    <!-- 첫 입장 화면 (시안 2: 금색 테두리 크림 패널 / 배경은 실제 공원 지도) -->
    <section id="title" class="entry-overlay">
      <form id="titleForm" class="entry-panel entry-main" autocomplete="off" novalidate>
        <div class="entry-crest" aria-hidden="true">
          <svg class="crest-castle" viewBox="0 0 120 40"><path d="M20 40V22l8-8 8 8v18zM44 40V16l10-12 10 12v24zM76 40V20l9-9 9 9v20zM98 40V24l6-6 6 6v16z"/><path class="flag" d="M54 4V0h8l-3 2 3 2zM28 14V9h7l-3 2 3 2zM85 11V6h7l-3 2 3 2z"/></svg>
          <span>MAKE PARK</span>
          <svg class="sparkle crest-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg>
        </div>
        <h1 class="entry-title"><svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg><span>메이크파크에 오신 걸 환영해요!</span><svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg></h1>
        <p class="entry-sub line-deco" id="entrySub"><span>닉네임과 학년을 골라요</span></p>
        <p id="welcomeBack" class="entry-welcome" hidden></p>

        <div class="nick-row">
          <label class="nick-label" for="nickname"><svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg>닉네임</label>
          <input id="nickname" class="nick-input" type="text" maxlength="40" placeholder="공원에서 사용할 이름"
                 autocomplete="off" spellcheck="false" aria-describedby="nickError">
        </div>
        <p id="nickError" class="field-msg" aria-live="polite"></p>

        <fieldset class="grade-set">
          <legend class="grade-legend"><svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg>학년</legend>
          <div class="grade-grid">
            <label class="grade-opt"><input type="radio" name="grade" value="1"><span>1학년</span></label>
            <label class="grade-opt"><input type="radio" name="grade" value="2"><span>2학년</span></label>
            <label class="grade-opt"><input type="radio" name="grade" value="3"><span>3학년</span></label>
            <label class="grade-opt"><input type="radio" name="grade" value="4"><span>4학년</span></label>
            <label class="grade-opt"><input type="radio" name="grade" value="5"><span>5학년</span></label>
            <label class="grade-opt"><input type="radio" name="grade" value="6"><span>6학년</span></label>
          </div>
        </fieldset>

        <p class="entry-note line-deco"><span>학년에 맞는 미션을 준비해 드려요</span></p>
        <button id="enterPark" type="submit" class="entry-go" disabled>공원으로 출발!</button>
        <p id="titleHint" class="entry-hint" aria-live="polite"></p>
        <p id="storageNote" class="entry-storage" hidden>이 기기에는 저장할 수 없어요. 이번에만 기억하고, 다음에 다시 입력해야 해요.</p>
        <svg class="sparkle bottom-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg>
      </form>
    </section>

    <!-- 프로필 수정 (공원 안에서 닉네임을 누르면 열림) -->
    <section id="profile" class="overlay dim" hidden>
      <form id="profileForm" class="entry-panel profile-panel" role="dialog" aria-modal="true" aria-labelledby="profileTitle" autocomplete="off" novalidate>
        <h2 id="profileTitle" class="profile-title">내 정보 바꾸기</h2>
        <div class="nick-row">
          <label class="nick-label" for="profileNick">닉네임</label>
          <input id="profileNick" class="nick-input" type="text" maxlength="40" autocomplete="off" spellcheck="false" aria-describedby="profileNickError">
        </div>
        <p id="profileNickError" class="field-msg" aria-live="polite"></p>
        <fieldset class="grade-set">
          <legend class="grade-legend"><span>학년</span></legend>
          <div class="grade-grid">
            <label class="grade-opt"><input type="radio" name="profileGrade" value="1"><span>1학년</span></label>
            <label class="grade-opt"><input type="radio" name="profileGrade" value="2"><span>2학년</span></label>
            <label class="grade-opt"><input type="radio" name="profileGrade" value="3"><span>3학년</span></label>
            <label class="grade-opt"><input type="radio" name="profileGrade" value="4"><span>4학년</span></label>
            <label class="grade-opt"><input type="radio" name="profileGrade" value="5"><span>5학년</span></label>
            <label class="grade-opt"><input type="radio" name="profileGrade" value="6"><span>6학년</span></label>
          </div>
        </fieldset>
        <p class="entry-note small">바꾼 학년은 다음에 시작하는 미션부터 적용돼요. 모은 기록은 그대로예요.</p>
        <div class="profile-actions">
          <button id="profileCancel" type="button" class="profile-cancel">취소</button>
          <button id="profileSave" type="submit" class="entry-go">저장</button>
        </div>
      </form>
    </section>


    <!-- 코스터 익스프레스 (코딩 놀이기구) -->
    <section id="coaster" class="coaster-overlay" hidden aria-label="코스터 익스프레스">
      <div class="cs-stage">
        <p class="cs-course" id="csCourse"></p>
        <p class="cs-tickets" id="csTickets"></p>
        <h2 class="cs-title">코스터 익스프레스</h2>
        <div class="cs-ribbon">
          <button type="button" class="cs-nav" id="csPrev" aria-label="이전 미션">◀</button>
          <p><span class="cs-mission" id="csMission"></span><span class="cs-missionno" id="csMissionNo"></span></p>
          <button type="button" class="cs-nav" id="csNext" aria-label="다음 미션">▶</button>
        </div>
        <button type="button" class="cs-over cs-exit" id="csExit">공원으로</button>
        <p class="cs-guide" id="csGuide"></p>
        <div class="cs-board" id="csBoard" role="img" aria-label="레일과 역, 열차가 있는 게임 영역"></div>
        <p class="cs-status" id="csStatus" role="status" aria-live="polite"></p>
        <div class="cs-cmds" id="csCmds" role="group" aria-label="사용할 수 있는 명령"></div>
        <h3 class="cs-listtitle">내 명령</h3>
        <div class="cs-list" id="csList" aria-label="내 명령 목록"></div>
        <button type="button" class="cs-clear" id="csClear">명령 지우기</button>
        <button type="button" class="cs-over cs-step" id="csStep">한 단계씩</button>
        <button type="button" class="cs-over cs-reset" id="csReset">열차 되돌리기</button>
        <button type="button" class="cs-over cs-run" id="csRun">실행</button>
        <div class="cs-success" id="csSuccess" hidden role="dialog" aria-label="도착 성공">
          <div class="cs-success-card">
            <p class="cs-success-title">도착했어요!</p>
            <p id="csSuccessMsg"></p>
            <p id="csSuccessStamp" class="cs-success-stamp" hidden>★ 코스터 스탬프를 받았어요!</p>
            <p id="csSuccessSave" class="cs-success-save" hidden>이 기기에는 저장되지 않았어요. 기록은 이번에만 남아요.</p>
            <div class="cs-success-btns">
              <button type="button" class="cs-pill" id="csSuccessNext">다음 미션</button>
              <button type="button" class="cs-pill light" id="csSuccessAgain">다시 하기</button>
              <button type="button" class="cs-pill light" id="csSuccessPark">공원으로</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 게임 화면 UI -->
    <div id="hud" hidden>
      <button class="chip" id="playerChip" type="button" aria-label="내 정보 바꾸기"><span class="dot"></span><span id="playerName"></span><span class="chip-grade" id="playerGrade"></span><span class="chip-edit" aria-hidden="true">✎</span></button>
      <div class="hud-right">
        <button id="charOpen" class="btn hud-btn" type="button">캐릭터</button>
        <button id="seasonToggle" class="btn hud-btn season-btn" type="button"><small>계절</small> <span id="seasonLabel">크리스마스</span></button>
        <button id="mapToggle" class="btn hud-btn" type="button">전체 지도</button>
      </div>
    </div>

    <div id="mapBar" hidden>
      <p>핀을 누르면 그 시설로 걸어가요</p>
      <button id="mapBack" class="btn primary hud-btn" type="button">플레이 화면으로</button>
    </div>

    <button id="enterFacility" class="btn primary enter-btn" type="button" hidden>
      <span class="enter-name" id="enterName"></span>
      <span class="enter-label">입장하기 <kbd>스페이스</kbd></span>
    </button>

    <div id="toast" class="toast" hidden></div>

    <!-- 캐릭터 고르기 (처음 입장 / 공원 위쪽 '캐릭터' 버튼) -->
    <section id="charDlg" class="overlay dim" hidden>
      <div class="entry-panel char-panel" role="dialog" aria-modal="true" aria-labelledby="charTitle">
        <h2 id="charTitle" class="profile-title">내 캐릭터</h2>
        <p id="charTickets" class="char-tickets"></p>
        <div id="charList" class="char-list"></div>
        <p id="charMsg" class="entry-hint" aria-live="polite"></p>
        <div class="profile-actions">
          <button id="charClose" type="button" class="profile-cancel">닫기</button>
        </div>
      </div>
    </section>

    <!-- 시설 안내창 -->
    <section id="modal" class="overlay dim" hidden>
      <div class="card modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle"></h2>
        <p id="modalDesc" class="desc"></p>
        <p class="soon">곧 문을 열어요!</p>
        <button id="modalClose" class="btn primary big" type="button">닫기</button>
      </div>
    </section>

    <!-- 개발용 디버그 정보 (?debug=1 또는 F2) -->
    <pre id="debugPanel" hidden></pre>
  </div>

  <script src="js/data/park-data.js"></script>
  <script src="js/data/walkmask.js"></script>
  <script src="js/walkgrid.js"></script>
  <script src="js/character.js"></script>
  <script src="js/data/character-sprites.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/game.js"></script>
  <script src="js/coaster/missions.js"></script>
  <script src="js/coaster/logic.js"></script>
  <script src="js/coaster/ui.js"></script>
</body>
</html>
