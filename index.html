<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>메이크파크</title>
  <link rel="manifest" href="student.webmanifest">
  <meta name="theme-color" content="#6a3d9a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="메이크파크">
  <link rel="apple-touch-icon" href="assets/icons/student-apple-180.png">
  <link rel="icon" type="image/png" href="assets/icons/student-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/coaster.css">
  <link rel="stylesheet" href="css/gatekeeper.css">
  <link rel="stylesheet" href="css/melody.css">
  <link rel="stylesheet" href="css/picnic.css">
  <link rel="stylesheet" href="css/parade.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/thrill.css">
  <link rel="stylesheet" href="css/net.css">
  <link rel="stylesheet" href="css/title.css">
  <link rel="stylesheet" href="css/buttons.css">
  <!-- 선생님 모드(?teacher=반코드): 첫 입장 화면(닉네임 창)이 잠깐 보이지 않게 그림을 그리기 전에 표시 -->
  <script>if (/[?&]teacher=\d{5}/.test(location.search)) document.documentElement.classList.add('teacher-mode');</script>
</head>
<body>
  <div id="app">
    <canvas id="stage" aria-label="메이크파크 공원 지도"></canvas>

    <!-- 앱으로 설치(브라우저가 설치할 수 있다고 알려 줄 때만 보임, js/pwa.js) -->
    <button id="installApp" class="install-app" type="button" hidden>📲 앱으로 설치</button>
    <!-- 첫 입장 화면: 정문 그림 배경(assets/ui/title-bg.webp) 위 단순한 흰 카드 (css/title.css) -->
    <section id="title" class="entry-overlay title-screen">
      <form id="titleForm" class="title-card" autocomplete="off" novalidate>
        <p class="title-kicker">어서 와요!</p>
        <h1 class="title-name">메이크파크</h1>
        <p class="title-sub">닉네임과 학년을 고르면 공원에 들어가요</p>
        <p id="welcomeBack" class="entry-welcome" hidden></p>

        <div class="nick-row">
          <label class="nick-label" for="nickname">닉네임</label>
          <input id="nickname" class="nick-input" type="text" maxlength="40" placeholder="공원에서 사용할 이름"
                 autocomplete="off" spellcheck="false" aria-describedby="nickError">
        </div>
        <p id="nickError" class="field-msg" aria-live="polite"></p>

        <fieldset class="grade-set">
          <legend class="grade-legend">학년</legend>
          <div class="grade-grid">
            <label class="grade-opt"><input type="radio" name="grade" value="1"><span>1학년</span></label>
            <label class="grade-opt"><input type="radio" name="grade" value="2"><span>2학년</span></label>
            <label class="grade-opt"><input type="radio" name="grade" value="3"><span>3학년</span></label>
            <label class="grade-opt"><input type="radio" name="grade" value="4"><span>4학년</span></label>
            <label class="grade-opt"><input type="radio" name="grade" value="5"><span>5학년</span></label>
            <label class="grade-opt"><input type="radio" name="grade" value="6"><span>6학년</span></label>
          </div>
        </fieldset>

        <button id="enterPark" type="submit" class="entry-go" disabled>공원으로 출발!</button>
        <p id="titleHint" class="entry-hint" aria-live="polite"></p>
        <p id="storageNote" class="entry-storage" hidden>이 기기에는 저장할 수 없어요. 이번에만 기억하고, 다음에 다시 입력해야 해요.</p>
      </form>
    </section>

    <!-- 프로필 수정 (공원 안에서 닉네임을 누르면 열림) -->
    <section id="profile" class="overlay dim" hidden>
      <form id="profileForm" class="entry-panel profile-panel" role="dialog" aria-modal="true" aria-labelledby="profileTitle" autocomplete="off" novalidate>
        <h2 id="profileTitle" class="profile-title">내 정보 바꾸기</h2>
        <div class="nick-row">
          <label class="nick-label" for="profileNick">닉네임</label>
          <input id="profileNick" class="nick-input" type="text" maxlength="40" autocomplete="off" spellcheck="false" aria-describedby="profileNickError">
        </div>
        <p id="profileNickError" class="field-msg" aria-live="polite"></p>
        <fieldset class="grade-set">
          <legend class="grade-legend"><span>학년</span></legend>
          <div class="grade-grid">
            <label class="grade-opt"><input type="radio" name="profileGrade" value="1"><span>1학년</span></label>
            <label class="grade-opt"><input type="radio" name="profileGrade" value="2"><span>2학년</span></label>
            <label class="grade-opt"><input type="radio" name="profileGrade" value="3"><span>3학년</span></label>
            <label class="grade-opt"><input type="radio" name="profileGrade" value="4"><span>4학년</span></label>
            <label class="grade-opt"><input type="radio" name="profileGrade" value="5"><span>5학년</span></label>
            <label class="grade-opt"><input type="radio" name="profileGrade" value="6"><span>6학년</span></label>
          </div>
        </fieldset>
        <p class="entry-note small">바꾼 학년은 다음에 시작하는 미션부터 적용돼요. 모은 기록은 그대로예요.</p>
        <div class="profile-actions">
          <button id="profileCancel" type="button" class="profile-cancel">취소</button>
          <button id="profileSave" type="submit" class="entry-go">저장</button>
        </div>
      </form>
    </section>


    <!-- 코스터역: 블록을 쌓아 선로 만들기 (화면은 js/coaster/ui.js 가 만듦) -->
    <section id="coaster" class="coaster-overlay" hidden aria-label="코스터역 — 블록으로 선로 만들기"></section>

    <!-- 유령의 집: 문지기의 비밀 규칙 (화면은 js/gatekeeper/ui.js 가 만듦) -->
    <section id="gatekeeper" class="gk-overlay" hidden aria-label="유령의 집 — 문지기의 비밀 규칙"></section>

    <!-- 멜로디 스테이지: 댄스 미션·자유 연주 (화면은 js/melody/ui.js 가 만듦) -->
    <section id="melody" class="ml-overlay" hidden aria-label="멜로디 스테이지 — 댄스 미션과 자유 연주"></section>

    <!-- 토리네 도시락: 도시락 주문 수학 놀이 (예전 매표소 자리, 화면은 js/picnic/ui.js 가 만듦) -->
    <section id="picnic" class="pc-overlay" hidden aria-label="토리네 도시락"></section>

    <!-- 레인보우 퍼레이드: 대기실 걷기·리리에게 말 걸기 → 현수막 꾸미기 → 퍼레이드 팝업. 화면은 js/parade/ui.js 가 만듦 -->
    <section id="parade" class="pr-overlay" hidden aria-label="레인보우 퍼레이드"></section>

    <!-- 플레이 아케이드: 로비 걷기 → 별빛 팡팡(오른손·방향키로 별 받기) · 캡슐 뽑기. 화면은 js/arcade/ui.js 가 만듦 -->
    <section id="arcade" class="ac-overlay" hidden aria-label="플레이 아케이드"></section>

    <!-- 짜릿 어드벤처: 토토의 범퍼카 연구소 — 광장 걷기·토토에게 말 걸기 → 학년 → 범퍼카 미션. 화면은 js/thrill/ui.js 가 만듦 -->
    <section id="thrill" class="th-overlay" hidden aria-label="짜릿 어드벤처 — 토토의 범퍼카 연구소"></section>

    <!-- 게임 화면 UI -->
    <div id="hud" hidden>
      <button class="chip" id="playerChip" type="button" aria-label="내 정보 바꾸기"><span class="dot"></span><span id="playerName"></span><span class="chip-grade" id="playerGrade"></span><span class="chip-edit" aria-hidden="true">✎</span></button>
      <span class="chip ticket-chip" id="ticketChip" aria-live="polite"><span aria-hidden="true">🎟️</span> 티켓 <b id="ticketCount">0</b>장</span>
      <span class="chip room-chip" id="roomChip" hidden></span>
      <div class="hud-right">
        <button id="charOpen" class="btn hud-btn" type="button">캐릭터</button>
      </div>
      <!-- 미니맵: 내가 어디 있는지. 누르면 전체 지도로 크게 펼쳐짐(시설 핀을 누르면 걸어감) -->
      <button id="miniMap" class="mini-map" type="button" aria-label="지도 크게 보기 (M)">
        <canvas id="miniCanvas" aria-hidden="true"></canvas>
        <span class="mini-hint" aria-hidden="true">⤢</span>
      </button>
    </div>

    <!-- 대화: 정해진 이모지·문장만 골라 말풍선으로 (반 공원에 들어왔을 때만, js/net/multiplayer.js 가 채움) -->
    <div id="chatBar" class="chat-bar" hidden>
      <div id="chatPhrases" class="chat-phrases" hidden role="menu" aria-label="보낼 문장"></div>
      <div class="chat-row">
        <div id="chatEmojis" class="chat-emojis" role="group" aria-label="보낼 이모지"></div>
        <button id="chatMore" class="chat-more" type="button" aria-expanded="false" aria-controls="chatPhrases">💬<span>말하기</span></button>
      </div>
      <p id="chatOff" class="chat-off" hidden>선생님이 대화를 잠시 껐어요</p>
    </div>

    <div id="mapBar" hidden>
      <p>핀을 누르면 그 시설로 걸어가요</p>
      <button id="mapBack" class="btn primary hud-btn" type="button">플레이 화면으로</button>
    </div>

    <button id="enterFacility" class="btn primary enter-btn" type="button" hidden>
      <span class="enter-name" id="enterName"></span>
      <span class="enter-label">입장하기 <kbd>스페이스</kbd></span>
    </button>

    <div id="toast" class="toast" hidden></div>

    <!-- 캐릭터 고르기 (처음 입장 / 공원 위쪽 '캐릭터' 버튼) -->
    <section id="charDlg" class="overlay dim" hidden>
      <div class="entry-panel char-panel" role="dialog" aria-modal="true" aria-labelledby="charTitle">
        <h2 id="charTitle" class="profile-title">내 캐릭터</h2>
        <p id="charTickets" class="char-tickets"></p>
        <div id="charList" class="char-list"></div>
        <p id="charMsg" class="entry-hint" aria-live="polite"></p>
        <div class="profile-actions">
          <button id="charClose" type="button" class="profile-cancel">닫기</button>
        </div>
      </div>
    </section>

    <!-- 시설 안내창 -->
    <section id="modal" class="overlay dim" hidden>
      <div class="card modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle"></h2>
        <p id="modalDesc" class="desc"></p>
        <p class="soon">곧 문을 열어요!</p>
        <button id="modalClose" class="btn primary big" type="button">닫기</button>
      </div>
    </section>

    <!-- 개발용 디버그 정보 (?debug=1 또는 F2) -->
    <pre id="debugPanel" hidden></pre>
  </div>

  <script>document.write('<script src="js/pwa.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/data/park-data.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/data/walkmask.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/walkgrid.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/character.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/data/character-sprites.js?t=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="js/characters.js?t=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="js/map-labels.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/snow.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/game.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/coaster/missions.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/coaster/logic.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/coaster/generate.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/coaster/ui.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/gatekeeper/rules.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/gatekeeper/sprites.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/gatekeeper/ui.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/melody/data.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/melody/rhythm.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/melody/audio.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/melody/ui.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/picnic/orders.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/picnic/ui.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/parade/show.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/parade/ui.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/arcade/hand.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/arcade/ui.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/thrill/physics.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/thrill/people.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/thrill/missions.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/thrill/ui.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/data/teacher-sprites.js?t=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="js/teacher-chars.js?t=' + Date.now() + '"><' + '/script>');</script>
  <!-- 선생님 모드(?teacher=반코드): 선생님 구글 계정으로 연결 -->
  <script>if (/[?&]teacher=\d{5}/.test(location.search)) window.MP_NET_ROLE = 'teacher';</script>
  <script>document.write('<script src="js/net/firebase-config.js?t=' + Date.now() + '"><' + '/script>');</script>
  <script>document.write('<script src="js/net/net.js?t=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="js/net/multiplayer.js?t=' + Date.now() + '"><\/script>');</script>
</body>
</html>
